plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.20' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.20' apply false
    id 'org.jlleitschuh.gradle.ktlint' version '14.2.0' apply false
}

subprojects {
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'org.jlleitschuh.gradle.ktlint'

    group = 'de.praxisit.mule'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:6.1.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core:3.27.7'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    kotlin {
        jvmToolchain(21)
    }

    ktlint {
        version = '1.8.0'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    // The Dockerfile caches these in a layer of its own. Unlike the dependencies report it fails when a download fails.
    tasks.register('downloadDependencies') {
        group = 'build setup'
        description = 'Downloads what compiling and packaging the main code needs.'
        def needed = ['compileClasspath', 'runtimeClasspath', 'kotlinCompilerClasspath',
                      'kotlinCompilerPluginClasspathMain', 'kotlinBuildToolsApiClasspath']
        def classpaths = configurations.matching { it.name in needed }
        doLast {
            classpaths.each { it.files }
        }
    }
}
