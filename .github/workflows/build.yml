name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, lint and test
        run: ./gradlew build

  e2e:
    name: Docker image and E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          tags: mule:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container with the test API
        run: |
          docker run -d --name mule -p 8089:8080 -e MULE_TEST_API=true mule:ci
          for _ in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' mule)" = healthy ] && exit 0
            sleep 1
          done
          docker logs mule
          exit 1
      - name: Check that the image keeps the test API off
        run: |
          docker run -d --name mule-default -p 8090:8080 mule:ci
          timeout 60 sh -c 'until curl -sf http://localhost:8090/health > /dev/null; do sleep 1; done'
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' \
            http://localhost:8090/api/test/games)
          test "$status" = 404
          docker rm -f mule-default
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright with Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests against the container
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8089
        run: npx playwright test
      - name: Container log
        if: failure()
        run: docker logs mule
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
